<!doctype html>
<html lang="fi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Opero Ajo MVP</title>
<link rel="stylesheet" href="ajo-mvp-test.css">
</head>
<body>
<div class="splash"><div class="splashbox"><div class="word"><span class="logo"></span><span>OPERO</span></div><div class="line"></div><div class="product">AJO</div><div class="line bottom"></div><div class="load">Ladataan...</div></div></div>
<div class="app">
<header class="top no-print"><span class="logo"></span><div class="brand"><b>OPERO</b><span>AJO</span></div></header>
<section id="home"><div class="card"><div class="actions"><button class="tile" data-go="new"><i>🚗</i><span data-t="newTrip"></span></button><button class="tile" data-go="report"><i>📄</i><span data-t="report"></span></button><button class="tile" data-go="drives"><i>🛣️</i><span data-t="trips"></span></button><button class="tile" data-go="settings"><i>⚙️</i><span data-t="settings"></span></button></div></div><div class="card"><div class="title"><h2 data-t="thisMonth"></h2><span id="homeMonth" class="muted"></span></div><div id="homeStats" class="stats"></div></div><div class="card"><div class="title"><h2 data-t="recent"></h2></div><div id="recent" class="list"></div></div></section>
<section id="new" class="hidden"><div class="card"><div class="title"><h2 data-t="newTrip"></h2></div><div class="grid"><div><label data-t="date"></label><input id="date" type="date"></div><div><label data-t="start"></label><select id="start"></select></div><div id="customStartBox" class="hidden"><label data-t="customStart"></label><input id="customStart"></div><button class="ghost no-print" id="locateBtn" data-t="locate"></button><div id="geo" class="muted"></div><div><label data-t="place"></label><input id="place"></div><div><label data-t="dest"></label><input id="dest"></div><div class="card inner"><div class="title"><h2 data-t="stops"></h2><button class="ghost no-print" id="addStop" data-t="addStop"></button></div><div id="stops" class="list"></div></div><div><label data-t="purpose"></label><input id="purpose"></div><div class="grid2"><div><label>€/km</label><input id="rate" type="number" step="0.01"></div><div><label>Km</label><input id="km" type="number" step="0.1"></div></div><div class="switch no-print"><button id="one" class="tab active" data-round="false" data-t="one"></button><button id="round" class="tab" data-round="true" data-t="round"></button></div><div class="grid2 no-print"><button class="ghost" id="lookup" data-t="calc"></button><button class="ghost" id="maps" data-t="maps"></button></div><div id="distStatus" class="muted"></div><div class="result"><div class="row"><span data-t="kmComp"></span><b id="kmComp">0,00 €</b></div></div><div class="card inner"><div class="title"><h2 data-t="expenses"></h2><button class="ghost no-print" id="openEx" data-t="addExpense"></button></div><div id="expenses" class="list"></div></div><div><label data-t="notes"></label><textarea id="notes"></textarea></div><div class="result"><div class="row"><span data-t="expenseTotal"></span><b id="expenseTotal">0,00 €</b></div><div class="row"><span data-t="total"></span><b id="grandTotal">0,00 €</b></div></div><div class="grid2 no-print"><button class="btn" id="saveDrive" data-t="save"></button><button class="ghost" id="clearForm" data-t="clear"></button></div></div></div></section>
<section id="drives" class="hidden"><div class="card"><div class="title"><h2 data-t="trips"></h2><span id="count" class="muted"></span></div><div id="driveList" class="list"></div></div></section>
<section id="report" class="hidden"><div class="card"><div class="title"><h2 data-t="report"></h2></div><div class="grid"><div class="grid2"><div><label data-t="month"></label><select id="repMonth"></select></div><div><label data-t="year"></label><select id="repYear"></select></div></div><div id="repTotals" class="grid"></div><label class="no-print"><input id="incReceipts" type="checkbox" class="inline"> <span data-t="includeReceipts"></span></label><div class="grid2 no-print"><button class="btn" id="printReport" data-t="createPdf"></button><button class="ghost" id="refreshReport" data-t="refresh"></button></div></div></div><div class="card"><div class="title"><h2 data-t="rows"></h2></div><div id="repRows" class="list"></div></div></section>
<section id="settings" class="hidden"><div class="card"><div class="title"><h2 data-t="settings"></h2></div><div class="grid2"><div><label data-t="name"></label><input id="userName"></div><div><label data-t="defaultRate"></label><input id="defaultRate" type="number" step="0.01"></div><div><label data-t="theme"></label><select id="theme"><option value="dark">Tumma / Dark</option><option value="light">Vaalea / Light</option></select></div><div><label data-t="language"></label><select id="lang"><option value="fi">Suomi</option><option value="en">English</option></select></div></div></div><div class="card"><div class="title"><h2 data-t="locations"></h2><span class="muted">Max 5</span></div><div id="locations" class="list"></div><div class="grid"><div><label data-t="placeName"></label><input id="locName"></div><div><label data-t="address"></label><input id="locAddress"></div><button class="ghost no-print" id="addLocation" data-t="addLocation"></button></div></div></section>
</div>
<nav class="nav no-print"><div class="in"><button class="active" data-s="home">🏚️</button><button data-s="new">🚗</button><button data-s="drives">🛣️</button><button data-s="report">📄</button></div></nav>
<dialog id="exModal"><div class="title"><h2 data-t="addExpenseTitle"></h2><button class="ghost" id="closeEx" data-t="close"></button></div><div class="grid"><div><label data-t="type"></label><select id="exType"></select></div><div id="exCustomBox" class="hidden"><label data-t="desc"></label><input id="exCustom"></div><div><label data-t="amount"></label><input id="exAmount" type="number" step="0.01"></div><div><label data-t="desc"></label><input id="exDesc"></div><div><label data-t="receipt"></label><input id="exReceipt" type="file" accept="image/*"></div><button class="btn" id="addExpense" data-t="saveExpense"></button></div></dialog>
<script src="ajo-mvp-test.js"></script>
</body>
</html>

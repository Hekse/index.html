<!doctype html><html lang='fi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#07111f'><title>Opero Ajo</title><style>:root{--b:#07111f;--p:#0d1b2f;--p2:#10233d;--t:#eef4ff;--m:#9db0d3;--l:rgba(125,170,255,.18);--a:#2f80ff;--a2:#6ea8ff;--g:#22c55e;--r:#ef4444;--s:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(47,128,255,.22),transparent 35%),linear-gradient(180deg,#07111f,#091726);color:var(--t);font:15px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#091525;color:var(--t);border:1px solid var(--l);border-radius:15px;padding:13px 12px}textarea{min-height:80px}.app{max-width:760px;margin:auto;padding:14px 12px calc(100px + var(--s))}.top{position:sticky;top:0;z-index:5;padding:8px 0 12px;background:linear-gradient(180deg,rgba(7,17,31,.9),transparent);backdrop-filter:blur(16px)}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:50%;position:relative;background:radial-gradient(circle at 30% 25%,#33b1ff,#1f7fff 42%,#0a2f7d);box-shadow:0 0 26px rgba(47,128,255,.28)}.logo:before{content:'';position:absolute;inset:8px;border-radius:50%;border:4px solid #fff;border-right-color:transparent;transform:rotate(-18deg)}.logo:after{content:'';position:absolute;left:24px;top:6px;width:5px;height:42px;border-radius:5px;background:linear-gradient(#fff,#8ecbff);transform:rotate(41deg)}.bt{font-size:26px;font-weight:950;letter-spacing:.05em;line-height:1}.bs{font-size:14px;font-weight:800;letter-spacing:.22em;margin-top:5px}.card{background:linear-gradient(180deg,var(--p),rgba(255,255,255,.015));border:1px solid var(--l);border-radius:22px;box-shadow:0 16px 38px rgba(0,0,0,.28);padding:14px;margin-bottom:14px}.hero{background:radial-gradient(circle at top right,rgba(47,128,255,.18),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015))}.grid{display:grid;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.act{min-height:120px;border-radius:24px;border:1px solid var(--l);background:rgba(255,255,255,.04);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:900}.ico{font-size:38px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.title h2{margin:0;font-size:18px}.btn,.ghost,.small,.danger{border:0;border-radius:15px;padding:13px 14px;font-weight:850}.btn{background:linear-gradient(180deg,var(--a2),var(--a));color:white}.ghost{background:rgba(255,255,255,.055);border:1px solid var(--l);color:var(--t)}.small{background:rgba(47,128,255,.13);border:1px solid rgba(47,128,255,.28);color:var(--t);padding:10px 12px}.danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#ffd0d0}.hide{display:none!important}.muted{color:var(--m);font-size:13px}.empty{padding:18px;text-align:center;color:var(--m)}.item{border:1px solid var(--l);background:rgba(255,255,255,.035);border-radius:17px;padding:13px}.ih{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.it{font-weight:900}.im{margin-top:7px;color:var(--m);font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border-radius:18px;border:1px solid var(--l);background:rgba(255,255,255,.04)}.stat small{display:block;color:var(--m);font-weight:700}.stat b{display:block;font-size:21px;margin-top:5px}.tot{border-bottom:1px dashed var(--l);padding:11px 0;display:flex;justify-content:space-between}.tot:last-child{border-bottom:0}.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(7,17,31,.88);backdrop-filter:blur(22px);border-top:1px solid var(--l);padding:10px 12px calc(10px + var(--s))}.nav .in{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.nb{min-height:58px;border-radius:18px;border:1px solid var(--l);background:rgba(255,255,255,.04);color:var(--m);font-size:24px}.nb.on{background:rgba(47,128,255,.16);border-color:rgba(47,128,255,.35);color:white}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:99;max-width:560px;margin:auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px 14px;box-shadow:0 16px 38px rgba(0,0,0,.28)}@media(max-width:560px){.g2{grid-template-columns:1fr}.act{min-height:112px}.bt{font-size:24px}}@media print{.top,.nav,.np{display:none!important}body{background:white;color:black}.app{padding:0}.card,.item{box-shadow:none;background:white;color:black;border:1px solid #bbb;break-inside:avoid}}</style></head><body><div id='toast' class='toast hide'></div><div class='app'><div class='top np'><div class='brand'><div class='logo'></div><div><div class='bt'>OPERO</div><div class='bs'>AJO</div></div></div></div><section id='home'><div class='card hero'><div class='actions'><button class='act' onclick='go("new")'><span class='ico'>🚗</span>Uusi ajo</button><button class='act' onclick='go("report")'><span class='ico'>📄</span>Raportti</button><button class='act' onclick='go("drives")'><span class='ico'>🛣️</span>Ajot</button><button class='act' onclick='go("settings")'><span class='ico'>⚙️</span>Asetukset</button></div></div><div class='card'><div class='title'><h2>Tämän kuun koonti</h2><span id='hm' class='muted'></span></div><div id='stats' class='stats'></div></div><div class='card'><div class='title'><h2>Viimeisimmät ajot</h2></div><div id='recent' class='grid'></div></div></section><section id='new' class='hide'><div class='card'><div class='title'><h2>Uusi ajo</h2><button class='ghost np' onclick='reset()'>Tyhjennä</button></div><div class='grid'><label>Päivämäärä<input id='date' type='date'></label><label>Lähtöpaikka<select id='start'></select></label><label id='customWrap' class='hide'>Muu lähtöosoite<input id='custom' placeholder='Katuosoite, kaupunki'></label><label>Kohde / osoite<input id='dest' placeholder='Asiakas / osoite'></label><label>Ajon tarkoitus<input id='purpose' placeholder='Asiakaskäynti'></label><div class='g2'><button id='one' class='btn' onclick='type="meno";mark();calc()'>Meno</button><button id='round' class='ghost' onclick='type="paluu";mark();calc()'>Meno-paluu</button></div><div class='g2'><label>Reitin km<input id='km' type='number' step='0.1' inputmode='decimal' oninput='calc()'></label><label>€/km<input id='rate' type='number' step='0.01' inputmode='decimal' oninput='calc()'></label></div><div class='g2 np'><button class='ghost' onclick='maps()'>🗺️ Karttaan</button><button class='small' onclick='addCost()'>+ Lisää kulu</button></div><div id='costs' class='grid'></div><label>Muistiinpano<textarea id='note'></textarea></label><div class='card' style='margin:0;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.22)'><div class='tot'><span>Korvattavat km</span><b id='tkm'>0 km</b></div><div class='tot'><span>Km-korvaus</span><b id='kmv'>0,00 €</b></div><div class='tot'><span>Kulut</span><b id='cv'>0,00 €</b></div><div class='tot'><span>Yhteensä</span><b id='sum'>0,00 €</b></div></div><button class='btn np' onclick='save()'>✅ Tallenna ajo</button></div></div></section><section id='drives' class='hide'><div class='card'><div class='title'><h2>Ajot</h2><span id='count' class='muted'></span></div><div id='list' class='grid'></div></div></section><section id='report' class='hide'><div class='card'><div class='title'><h2>Raportti</h2></div><div class='grid'><div class='g2'><label>Kuukausi<select id='rm' onchange='rep()'></select></label><label>Vuosi<select id='ry' onchange='rep()'></select></label></div><div id='rt'></div><div class='g2 np'><button class='btn' onclick='window.print()'>📄 PDF / tulosta</button><button class='ghost' onclick='rep()'>Päivitä</button></div></div></div><div class='card'><div class='title'><h2>Raportin rivit</h2></div><div id='rr' class='grid'></div></div></section><section id='settings' class='hide'><div class='card'><div class='title'><h2>Asetukset</h2></div><div class='grid'><label>Nimi raportille<input id='name'></label><label>Oletus €/km<input id='defrate' type='number' step='0.01' inputmode='decimal'></label><button class='btn np' onclick='saveSet()'>Tallenna</button></div></div><div class='card'><div class='title'><h2>Lähtöpaikat</h2><span class='muted'>max 5</span></div><div id='locs' class='grid'></div><div class='grid' style='margin-top:12px'><label>Nimi<input id='ln' placeholder='Koti / Toimisto'></label><label>Osoite<input id='la' placeholder='Katuosoite, kaupunki'></label><button class='small np' onclick='addLoc()'>+ Lisää lähtöpaikka</button></div></div></section></div><div class='nav np'><div class='in'><button class='nb on' data-s='home' onclick='go("home")'>🏠</button><button class='nb' data-s='new' onclick='go("new")'>🚗</button><button class='nb' data-s='drives' onclick='go("drives")'>🛣️</button><button class='nb' data-s='report' onclick='go("report")'>📄</button></div></div><script>let data=JSON.parse(localStorage.ajoPhone||'{"drives":[],"settings":{"rate":0.57,"name":"","locs":[{"id":"koti","n":"Koti","a":""}]}}'),type='meno',costs=[];let q=x=>document.getElementById(x),eur=n=>(+n||0).toLocaleString('fi-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',kmf=n=>(+n||0).toLocaleString('fi-FI',{maximumFractionDigits:1})+' km',id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),store=()=>localStorage.ajoPhone=JSON.stringify(data),msg=t=>{q('toast').textContent=t;q('toast').classList.remove('hide');setTimeout(()=>q('toast').classList.add('hide'),2200)};function go(s){document.querySelectorAll('section').forEach(e=>e.classList.add('hide'));q(s).classList.remove('hide');document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.s==s));if(s=='report')rep();if(s=='drives')render();scrollTo(0,0)}function init(){let d=new Date();q('date').value=d.toISOString().slice(0,10);q('rate').value=data.settings.rate;q('defrate').value=data.settings.rate;q('name').value=data.settings.name||'';['Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu','Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'].forEach((m,i)=>q('rm').innerHTML+=`<option value='${i}'>${m}</option>`);q('rm').value=d.getMonth();for(let y=d.getFullYear()-2;y<=d.getFullYear()+1;y++)q('ry').innerHTML+=`<option>${y}</option>`;q('ry').value=d.getFullYear();q('start').onchange=()=>q('customWrap').classList.toggle('hide',q('start').value!='__custom__');render();reset()}function starts(){q('start').innerHTML='';(data.settings.locs||[]).forEach(l=>q('start').innerHTML+=`<option value='${l.id}'>${l.n}</option>`);q('start').innerHTML+=`<option value='__custom__'>Muu lähtöosoite</option>`;q('start').onchange()}function startAddr(){if(q('start').value=='__custom__')return q('custom').value.trim();let l=(data.settings.locs||[]).find(x=>x.id==q('start').value);return l?l.a:''}function mark(){q('one').className=type=='meno'?'btn':'ghost';q('round').className=type=='paluu'?'btn':'ghost'}function calc(){let base=+q('km').value||0,tkm=type=='paluu'?base*2:base,rate=+q('rate').value||0,cv=costs.reduce((s,c)=>s+(+c.v||0),0),kv=tkm*rate;q('tkm').textContent=kmf(tkm);q('kmv').textContent=eur(kv);q('cv').textContent=eur(cv);q('sum').textContent=eur(kv+cv);return{base,tkm,rate,cv,kv,sum:kv+cv}}function addCost(){let n=prompt('Kulun kuvaus','Pysäköinti')||'Kulu',v=+(prompt('Summa €','0')||0);if(v>0){costs.push({n,v});drawCosts();calc()}}function drawCosts(){q('costs').innerHTML=costs.map((c,i)=>`<div class='item'><div class='ih'><div><div class='it'>${c.n}</div><div class='im'>${eur(c.v)}</div></div><button class='danger np' onclick='costs.splice(${i},1);drawCosts();calc()'>Poista</button></div></div>`).join('')||''}function maps(){let s=startAddr(),d=q('dest').value.trim();if(!s||!d){msg('Lisää lähtöpaikka ja kohde');return}open('https://www.google.com/maps/dir/'+[s,d].map(encodeURIComponent).join('/'),'_blank')}function save(){let c=calc(),s=startAddr(),d=q('dest').value.trim();if(!s||!d||c.tkm<=0){msg('Täytä lähtöpaikka, kohde ja km');return}data.drives.unshift({id:id(),date:q('date').value,start:s,dest:d,purpose:q('purpose').value.trim(),type,base:c.base,km:c.tkm,rate:c.rate,kmv:c.kv,costs:[...costs],costv:c.cv,total:c.sum,note:q('note').value.trim()});store();msg('Ajo tallennettu');reset();render();go('home')}function reset(){costs=[];type='meno';mark();starts();q('dest').value='';q('purpose').value='';q('km').value='';q('note').value='';q('rate').value=data.settings.rate;drawCosts();calc()}function card(d){return`<div class='item'><div class='ih'><div><div class='it'>${d.dest}</div><div class='im'>${d.date} · ${d.start} → ${d.dest}</div><div class='im'>${d.type=='paluu'?'Meno-paluu':'Meno'} · ${kmf(d.km)} · ${eur(d.total)}</div></div><button class='danger np' onclick='del("${d.id}")'>Poista</button></div></div>`}function render(){data.drives.sort((a,b)=>b.date.localeCompare(a.date));q('list').innerHTML=data.drives.map(card).join('')||'<div class=empty>Ei ajoja vielä.</div>';q('recent').innerHTML=data.drives.slice(0,3).map(card).join('')||'<div class=empty>Ei ajoja vielä.</div>';q('count').textContent=data.drives.length+' ajoa';let n=new Date(),rows=data.drives.filter(d=>{let x=new Date(d.date+'T00:00');return x.getMonth()==n.getMonth()&&x.getFullYear()==n.getFullYear()}),t=sum(rows);q('hm').textContent=(n.getMonth()+1)+'/'+n.getFullYear();q('stats').innerHTML=stat('Ajot',rows.length+' kpl')+stat('Kilometrit',kmf(t.km))+stat('Korvaukset',eur(t.kmv))+stat('Yhteensä',eur(t.total));locs();rep()}function stat(a,b){return`<div class='stat'><small>${a}</small><b>${b}</b></div>`}function sum(rows){return rows.reduce((a,d)=>{a.km+=+d.km||0;a.kmv+=+d.kmv||0;a.costv+=+d.costv||0;a.total+=+d.total||0;return a},{km:0,kmv:0,costv:0,total:0})}function del(i){data.drives=data.drives.filter(d=>d.id!=i);store();render();msg('Ajo poistettu')}function rep(){let m=+q('rm').value,y=+q('ry').value,rows=data.drives.filter(d=>{let x=new Date(d.date+'T00:00');return x.getMonth()==m&&x.getFullYear()==y}).sort((a,b)=>a.date.localeCompare(b.date)),t=sum(rows);q('rt').innerHTML=`<div class='tot'><span>Ajot</span><b>${rows.length} kpl</b></div><div class='tot'><span>Kilometrit</span><b>${kmf(t.km)}</b></div><div class='tot'><span>Km-korvaukset</span><b>${eur(t.kmv)}</b></div><div class='tot'><span>Kulut</span><b>${eur(t.costv)}</b></div><div class='tot'><span>Yhteensä</span><b>${eur(t.total)}</b></div>`;q('rr').innerHTML=rows.map(d=>`<div class='item'><div class='it'>${d.date} · ${d.dest}</div><div class='im'>${d.start} → ${d.dest}</div><div class='im'>${d.type=='paluu'?'Meno-paluu':'Meno'} · ${kmf(d.km)} · ${eur(d.total)}</div>${d.note?`<div class='im'>${d.note}</div>`:''}</div>`).join('')||'<div class=empty>Ei ajoja valitulla kuukaudella.</div>'}function saveSet(){data.settings.name=q('name').value.trim();data.settings.rate=+q('defrate').value||0.57;store();q('rate').value=data.settings.rate;msg('Asetukset tallennettu');render()}function locs(){q('locs').innerHTML=(data.settings.locs||[]).map(l=>`<div class='item'><div class='ih'><div><div class='it'>${l.n}</div><div class='im'>${l.a||'Osoite puuttuu'}</div></div><button class='danger np' onclick='remLoc("${l.id}")'>Poista</button></div></div>`).join('')||'<div class=empty>Ei lähtöpaikkoja.</div>';starts()}function addLoc(){let n=q('ln').value.trim(),a=q('la').value.trim();if(!n||!a){msg('Lisää nimi ja osoite');return}data.settings.locs=data.settings.locs||[];if(data.settings.locs.length>=5){msg('Max 5 lähtöpaikkaa');return}data.settings.locs.push({id:id(),n,a});q('ln').value='';q('la').value='';store();render()}function remLoc(i){data.settings.locs=(data.settings.locs||[]).filter(l=>l.id!=i);store();render()}init()</script></body></html>

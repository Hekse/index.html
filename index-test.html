<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07111f" />
<title>Opero Ajo – Supabase test</title>
<style>
:root{--b:#07111f;--p:#0d1b2f;--t:#eef4ff;--m:#9db0d3;--l:rgba(125,170,255,.18);--a:#2f80ff;--a2:#6ea8ff;--g:#22c55e;--r:#ef4444;--s:env(safe-area-inset-bottom,0px);--shadow:0 16px 38px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--b)}body{background:radial-gradient(circle at 50% 0,rgba(47,128,255,.22),transparent 35%),linear-gradient(180deg,#07111f,#091726);color:var(--t);font:15px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px 12px 40px}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 16px}.logo{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 30% 25%,#33b1ff,#1f7fff 42%,#0a2f7d);box-shadow:0 0 26px rgba(47,128,255,.28)}.bt{font-size:26px;font-weight:950;letter-spacing:.05em;line-height:1}.bs{font-size:14px;font-weight:800;letter-spacing:.22em;margin-top:5px}.card{background:linear-gradient(180deg,var(--p),rgba(255,255,255,.015));border:1px solid var(--l);border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.title h2{margin:0;font-size:18px}.grid{display:grid;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,input{font:inherit}input{width:100%;background:#091525;color:var(--t);border:1px solid var(--l);border-radius:15px;padding:13px 12px;outline:none}.btn,.ghost,.danger{border-radius:15px;padding:13px 14px;font-weight:850;cursor:pointer}.btn{border:0;background:linear-gradient(180deg,var(--a2),var(--a));color:white;box-shadow:0 10px 22px rgba(47,128,255,.22)}.ghost{background:rgba(255,255,255,.055);border:1px solid var(--l);color:var(--t)}.danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#ffd0d0}.muted{color:var(--m);font-size:13px}.item{border:1px solid var(--l);background:rgba(255,255,255,.035);border-radius:17px;padding:13px}.ok{color:#9ff0b5}.warn{color:#ffe08a}.err{color:#ffb4b4}.toast{position:fixed;top:12px;left:12px;right:12px;z-index:99;max-width:560px;margin:auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}.hide{display:none!important}@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toast" class="toast hide"></div>
<div class="app">
  <div class="brand"><div class="logo"></div><div><div class="bt">OPERO</div><div class="bs">AJO TEST</div></div></div>
  <div class="card"><div class="title"><h2>Supabase-pilvitallennuksen testisivu</h2></div><p class="muted">Tämä ei korvaa varsinaista Ajoa. Tämä testaa vain kirjautumisen, RLS-suojauksen ja ajojen tallennuksen pilveen.</p><div id="status" class="item warn">Ladataan...</div></div>
  <div class="card"><div class="title"><h2>Kirjautuminen</h2></div><div class="grid"><label>Sähköposti<input id="email" type="email" placeholder="opero@opero.fi"></label><label>Salasana<input id="password" type="password" placeholder="Vähintään 6 merkkiä"></label><div class="g2"><button class="btn" onclick="signInOrCreate()">Kirjaudu / luo käyttäjä</button><button class="ghost" onclick="signOut()">Kirjaudu ulos</button></div></div></div>
  <div class="card"><div class="title"><h2>Lisää testiajo pilveen</h2></div><div class="grid"><label>Päivä<input id="date" type="date"></label><label>Lähtö<input id="start" placeholder="Kuopio"></label><label>Kohde<input id="dest" placeholder="Iisalmi"></label><div class="g2"><label>Km<input id="km" type="number" step="0.1" value="10"></label><label>€/km<input id="rate" type="number" step="0.01" value="0.57"></label></div><button class="btn" onclick="saveTestDrive()">Tallenna testiajo pilveen</button></div></div>
  <div class="card"><div class="title"><h2>Pilvessä olevat ajot</h2><button class="ghost" onclick="loadDrives()">Päivitä</button></div><div id="list" class="grid"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://miahuckcphquawobehtk.supabase.co';
const SUPABASE_KEY='sb_publishable_tY1y97VnFfhXyKJ_9XCNGw_-rEq2pLx';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
const q=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>Number(String(v||0).replace(',','.'))||0;
const eur=n=>(+n||0).toLocaleString('fi-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const kmf=n=>(+n||0).toLocaleString('fi-FI',{maximumFractionDigits:1})+' km';
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function msg(t,kind='ok'){q('toast').textContent=t;q('toast').className='toast '+kind;setTimeout(()=>q('toast').classList.add('hide'),2600)}
function setStatus(text,cls='warn'){q('status').className='item '+cls;q('status').innerHTML=text}
async function refreshAuth(){const {data}=await sb.auth.getSession();currentUser=data?.session?.user||null;if(currentUser){setStatus('<span class="ok">✓ Kirjautunut:</span> '+esc(currentUser.email),'ok');await loadDrives()}else{setStatus('<span class="warn">⏳ Ei kirjautunut.</span> Luo testikäyttäjä tai kirjaudu sisään.','warn');q('list').innerHTML='<div class="muted">Kirjaudu ensin.</div>'}}
async function signInOrCreate(){const email=q('email').value.trim();const password=q('password').value;if(!email||password.length<6){msg('Lisää sähköposti ja vähintään 6 merkin salasana','warn');return}let res=await sb.auth.signInWithPassword({email,password});if(res.error){res=await sb.auth.signUp({email,password})}if(res.error){msg(res.error.message,'warn');setStatus('<span class="err">⚠ '+esc(res.error.message)+'</span>','err');return}currentUser=res.data?.user||res.data?.session?.user||currentUser;msg('Kirjautuminen / käyttäjä luotu');await refreshAuth()}
async function signOut(){await sb.auth.signOut();currentUser=null;await refreshAuth();msg('Kirjauduttu ulos')}
async function saveTestDrive(){if(!currentUser){msg('Kirjaudu ensin','warn');return}const km=num(q('km').value),rate=num(q('rate').value),total=km*rate;const row={user_id:currentUser.id,local_id:uid(),date:q('date').value||today(),start_address:q('start').value.trim()||'Testilähtö',destination:q('dest').value.trim()||'Testikohde',purpose:'Supabase test',trip_type:'meno',base_km:km,km,rate,km_comp:total,costs:[],cost_total:0,total,note:'Luotu index-test.html-testisivulta',receipts:[],sync_status:'synced',updated_at:new Date().toISOString()};const {error}=await sb.from('ajo_drives').insert(row);if(error){msg(error.message,'warn');setStatus('<span class="err">⚠ Tallennus epäonnistui: '+esc(error.message)+'</span>','err');return}msg('Testiajo tallennettu pilveen');await loadDrives()}
async function loadDrives(){if(!currentUser)return;const {data,error}=await sb.from('ajo_drives').select('*').order('date',{ascending:false}).limit(20);if(error){q('list').innerHTML='<div class="item err">'+esc(error.message)+'</div>';return}q('list').innerHTML=(data||[]).map(d=>`<div class="item"><b>${esc(d.destination)}</b><div class="muted">${esc(d.date)} · ${esc(d.start_address||'')} → ${esc(d.destination)}</div><div class="muted">${kmf(d.km)} · ${eur(d.total)}</div><div class="muted">local_id: ${esc(d.local_id)}</div></div>`).join('')||'<div class="muted">Ei ajoja pilvessä.</div>'}
q('date').value=today();
sb.auth.onAuthStateChange(()=>refreshAuth());
refreshAuth();
</script>
</body>
</html>

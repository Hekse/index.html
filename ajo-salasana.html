<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opero Ajo - Salasana</title><style>body{margin:0;background:#07111f;color:#eef4ff;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:640px;margin:auto;padding:18px 12px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:52px;height:52px;border-radius:14px;background:radial-gradient(circle at 30% 25%,#33b1ff,#1f7fff 42%,#0a2f7d);box-shadow:0 0 26px rgba(47,128,255,.28)}.bt{font-size:26px;font-weight:950}.bs{font-size:14px;font-weight:800;letter-spacing:.18em}.card{background:#0d1b2f;border:1px solid rgba(125,170,255,.22);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 16px 38px rgba(0,0,0,.28)}.grid{display:grid;gap:12px}input,button{font:inherit}input{width:100%;box-sizing:border-box;background:#091525;color:#eef4ff;border:1px solid rgba(125,170,255,.22);border-radius:15px;padding:13px}.btn{border:0;border-radius:15px;padding:14px;background:#2f80ff;color:white;font-weight:900}.ghost{border:1px solid rgba(125,170,255,.22);border-radius:15px;padding:14px;background:rgba(255,255,255,.055);color:white;font-weight:900}.muted{color:#9db0d3;font-size:13px}.item{border:1px solid rgba(125,170,255,.22);border-radius:16px;padding:12px;background:rgba(255,255,255,.035)}.ok{color:#9ff0b5}.warn{color:#ffe08a}.err{color:#ffb4b4}.hide{display:none}pre{white-space:pre-wrap;word-break:break-word;background:#06101e;border-radius:14px;padding:12px;color:#9db0d3;max-height:220px;overflow:auto}</style></head><body><div class="app"><div class="brand"><div class="logo"></div><div><div class="bt">OPERO</div><div class="bs">AJO SALASANA</div></div></div><div class="card"><h2>Salasanan palautus</h2><p class="muted">Kirjoita sähköposti ja paina palautuslinkkiä. Supabase lähettää sähköpostin, jos käyttäjä löytyy ja sähköpostiasetukset ovat käytössä.</p><div class="grid"><label>Sähköposti<input id="email" type="email" value="opero@opero.fi"></label><button class="btn" onclick="sendReset()">Lähetä salasanan palautuslinkki</button><a class="ghost" href="index.html" style="text-align:center;text-decoration:none">Takaisin Ajoon</a></div></div><div id="setCard" class="card hide"><h2>Aseta uusi salasana</h2><p class="muted">Tämä näkyy, jos tulit tänne Supabasen palautuslinkistä.</p><div class="grid"><label>Uusi salasana<input id="newpass" type="password" placeholder="Vähintään 6 merkkiä"></label><button class="btn" onclick="updatePass()">Vaihda salasana</button></div></div><div class="card"><h2>Tila</h2><div id="status" class="item warn">Valmis.</div><pre id="debug">Ei tapahtumia.</pre></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://miahuckcphquawobehtk.supabase.co';const SB_KEY=['sb_publishable_','tY1y97VnFfhXyKJ_','9XCNGw_-rEq2pLx'].join('');const sb=window.supabase.createClient(SB_URL,SB_KEY);const q=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function status(t,cls='warn'){q('status').className='item '+cls;q('status').innerHTML=t}function dbg(x){q('debug').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function sendReset(){const email=q('email').value.trim();if(!email){status('<span class="err">Lisää sähköposti.</span>','err');return}const redirectTo=location.origin+location.pathname;const res=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(res.error){status('<span class="err">Palautuslinkin lähetys epäonnistui: '+esc(res.error.message)+'</span>','err');dbg(res.error);return}status('<span class="ok">✓ Palautuslinkki pyydetty.</span><br><span class="muted">Tarkista sähköposti. Jos viestiä ei tule, Supabasen Auth-sähköpostiasetukset tai redirect-osoite pitää tarkistaa dashboardissa.</span>','ok');dbg({reset_requested_for:email,redirectTo})}async function updatePass(){const p=q('newpass').value;if(p.length<6){status('<span class="err">Salasanan pitää olla vähintään 6 merkkiä.</span>','err');return}const res=await sb.auth.updateUser({password:p});if(res.error){status('<span class="err">Salasanan vaihto epäonnistui: '+esc(res.error.message)+'</span>','err');dbg(res.error);return}status('<span class="ok">✓ Salasana vaihdettu.</span><br><span class="muted">Voit nyt palata Ajoon ja kirjautua uudella salasanalla.</span>','ok');dbg({password_updated:true})}async function init(){const res=await sb.auth.getSession();if(res?.data?.session){q('setCard').classList.remove('hide');status('<span class="ok">Palautussessio havaittu. Voit asettaa uuden salasanan.</span>','ok');dbg({session:true})}else{dbg({session:false,href:location.href})}}sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){q('setCard').classList.remove('hide');status('<span class="ok">Palautustila avattu. Aseta uusi salasana.</span>','ok');dbg({event})}});init();</script></body></html>
